<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход · Роминта</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b100f;color:#f4f7f5;font:16px system-ui,Arial}header{padding:16px}a{color:#ffd37f}.overlay{min-height:calc(100vh - 55px);display:grid;place-items:center;padding:20px}.dialog{width:min(100%,420px);padding:26px;border:1px solid #34483f;border-radius:22px;background:#18221e;box-shadow:0 20px 70px #0008}h1{margin:0 0 10px;font-size:25px}p{color:#b7c6bc;line-height:1.5}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{flex:1;background:#283b30;color:#f4f7f5}.tabs button.active{background:#f2a93b;color:#241707}label{display:block;margin:15px 0 7px}input{width:100%;padding:13px;border:1px solid #465a4e;border-radius:12px;background:#0b100f;color:white;font:inherit}button{padding:13px;border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}.submit{width:100%;margin-top:20px;background:#f2a93b;color:#241707}.submit:disabled{opacity:.55;cursor:wait}#status{min-height:24px;font-size:14px}</style></head><body><header><a href="./">← Гостевые дома</a></header><div class="overlay"><main class="dialog" role="region" aria-label="Авторизация"><h1>Личный кабинет</h1><p>Управление своими объектами и бронированиями.</p><div class="tabs"><button type="button" class="active" id="signin">Вход</button><button type="button" id="signup">Регистрация</button></div><form id="form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Пароль</label><input id="password" type="password" minlength="8" autocomplete="current-password" required><button class="submit" type="submit" id="submit">Войти</button></form><p id="status" role="status" aria-live="polite">Подключение авторизации пока не настроено.</p></main></div><script type="module">
const CONFIG={url:'',publishableKey:''}; // Populate with public Supabase settings after verification. Never use service_role keys.
let mode='signin';
const status=document.querySelector('#status'),submit=document.querySelector('#submit'),password=document.querySelector('#password');
function setMode(next){mode=next;document.querySelector('#signin').classList.toggle('active',next==='signin');document.querySelector('#signup').classList.toggle('active',next==='signup');submit.textContent=next==='signin'?'Войти':'Зарегистрироваться';password.autocomplete=next==='signin'?'current-password':'new-password';}
document.querySelector('#signin').onclick=()=>setMode('signin');document.querySelector('#signup').onclick=()=>setMode('signup');
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();if(!CONFIG.url||!CONFIG.publishableKey){status.textContent='Авторизация пока не подключена.';return;}submit.disabled=true;status.textContent='Проверяем данные…';try{const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');const client=createClient(CONFIG.url,CONFIG.publishableKey);const email=document.querySelector('#email').value.trim();const pwd=password.value;const result=mode==='signin'?await client.auth.signInWithPassword({email,password:pwd}):await client.auth.signUp({email,password:pwd});if(result.error)throw result.error;if(mode==='signin'&&result.data.session){location.assign('./owner.html');return;}status.textContent='Регистрация принята. Дальнейшие действия зависят от настроек подтверждения email.';}catch(err){status.textContent='Не удалось выполнить действие. Проверьте данные или попробуйте позже.';}finally{submit.disabled=false;}});
</script></body></html>
