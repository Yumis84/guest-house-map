<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Календарь доступности — У Степана</title>
  <style>
    :root{--forest:#20352b;--ink:#243129;--muted:#68746a;--gold:#c98c43;--paper:#fffdf8;--cream:#f7f4ec;--line:#e5e0d4;--unknown:#eee9de;--danger:#8a3324}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{padding:8px}.widget{width:min(100%,720px);margin:auto;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 36px #263c2a12;overflow:hidden}.head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 22px 14px}.eyebrow{margin:0 0 4px;color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.head h1{margin:0;font-size:clamp(20px,4vw,28px);line-height:1.15}.nav{display:flex;gap:8px}.nav button{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--forest);font-size:24px;cursor:pointer}.nav button:focus-visible{outline:3px solid #c98c4355;outline-offset:2px}.state{margin:0 22px 14px;padding:12px 14px;border-radius:14px;background:var(--cream);color:var(--muted);font-size:14px;line-height:1.45}.state[data-kind="loading"]:before{content:"";display:inline-block;width:11px;height:11px;margin-right:9px;border:2px solid #c9c2b3;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}.state[data-kind="error"]{background:#f9e8e3;color:var(--danger)}@keyframes spin{to{transform:rotate(360deg)}}.month{padding:0 22px 22px}.month-title{margin:0 0 12px;font-size:18px;text-transform:capitalize}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.week span{text-align:center;color:var(--muted);font-size:11px;font-weight:700}.day{aspect-ratio:1;min-width:0;border:1px solid #ded8cb;border-radius:11px;background:var(--unknown);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700}.day small{font-size:8px;font-weight:600;color:var(--muted)}.day.empty{visibility:hidden}.day.today{border:2px solid var(--gold)}.day[aria-disabled="true"]{cursor:default}.legend{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--muted);font-size:12px}.swatch{width:14px;height:14px;border:1px solid #ded8cb;border-radius:4px;background:var(--unknown)}.confirm{padding:18px 22px;background:var(--forest);color:#fff}.confirm strong{display:block;margin-bottom:5px;font-size:16px}.confirm p{margin:0 0 12px;color:#d5ded6;font-size:13px;line-height:1.45}.confirm a{display:inline-flex;align-items:center;min-height:42px;padding:0 16px;border-radius:999px;background:var(--gold);color:#fff;text-decoration:none;font-weight:800}.noscript{margin:16px;padding:14px;background:#f9e8e3;border-radius:12px;color:var(--danger)}@media(max-width:460px){body{padding:0}.widget{border-radius:16px}.head,.month,.confirm{padding-left:14px;padding-right:14px}.state{margin-left:14px;margin-right:14px}.week,.days{gap:3px}.day{border-radius:8px}.day small{display:none}}@media(prefers-reduced-motion:reduce){.state[data-kind="loading"]:before{animation:none}}
  </style>
</head>
<body>
  <main class="widget" aria-labelledby="calendarTitle">
    <header class="head">
      <div><p class="eyebrow">Доступность · только просмотр</p><h1 id="calendarTitle">Гостевой дом «У Степана»</h1></div>
      <div class="nav" aria-label="Переключение месяца"><button id="prevMonth" type="button" aria-label="Предыдущий месяц">‹</button><button id="nextMonth" type="button" aria-label="Следующий месяц">›</button></div>
    </header>
    <p class="state" id="loadState" data-kind="loading" role="status" aria-live="polite">Проверяем источник доступности…</p>
    <section class="month" aria-label="Календарь"><h2 class="month-title" id="monthTitle"></h2><div class="week" aria-hidden="true"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div class="days" id="calendarDays" role="grid"></div><div class="legend"><span class="swatch" aria-hidden="true"></span><span>Доступность не подтверждена</span></div></section>
    <aside class="confirm"><strong>Уточните даты у хозяина</strong><p>Календарь не подтверждает свободные даты. Отправьте запрос ниже на странице или позвоните Степану.</p><a href="tel:+79062194239">Позвонить: +7 906 219-42-39</a></aside>
    <noscript><p class="noscript">Для проверки источника календаря нужен JavaScript. Пожалуйста, уточните даты по телефону.</p></noscript>
  </main>
  <script>
  (()=>{
    'use strict';
    const PROPERTY_ID='4372d741-eab4-4c42-9ddc-88f78368f9b6';
    const API_URL='https://ojifyifewlwzkysgxogo.supabase.co';
    const PUBLISHABLE_KEY='sb_publishable_cliMT3e4u-QKFGaLyKhovg_WEJvw508';
    const state=document.getElementById('loadState'),days=document.getElementById('calendarDays'),title=document.getElementById('monthTitle');
    const now=new Date(),month=new Date(now.getFullYear(),now.getMonth(),1);
    const pad=n=>String(n).padStart(2,'0');
    const iso=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
    const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
    function render(){
      const y=month.getFullYear(),m=month.getMonth(),count=new Date(y,m+1,0).getDate(),offset=(new Date(y,m,1).getDay()+6)%7;
      title.textContent=new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(month);
      const fragment=document.createDocumentFragment();
      for(let i=0;i<offset;i++){const blank=document.createElement('span');blank.className='day empty';blank.setAttribute('aria-hidden','true');fragment.append(blank)}
      for(let d=1;d<=count;d++){
        const date=new Date(y,m,d),cell=document.createElement('span');cell.className='day'+(sameDay(date,now)?' today':'');cell.setAttribute('role','gridcell');cell.setAttribute('aria-disabled','true');cell.setAttribute('aria-label',`${d} ${title.textContent}: доступность не подтверждена`);cell.dataset.date=iso(y,m,d);cell.innerHTML=`<span>${d}</span><small>уточнить</small>`;fragment.append(cell)
      }
      days.replaceChildren(fragment)
    }
    async function checkInventory(){
      const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);
      try{
        const url=new URL('/rest/v1/physical_units',API_URL);url.searchParams.set('property_id',`eq.${PROPERTY_ID}`);url.searchParams.set('select','id');url.searchParams.set('limit','1');
        const response=await fetch(url,{method:'GET',headers:{apikey:PUBLISHABLE_KEY,Authorization:`Bearer ${PUBLISHABLE_KEY}`,Accept:'application/json'},signal:controller.signal,cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});
        if(!response.ok)throw new Error('inventory_unavailable');
        const rows=await response.json();if(!Array.isArray(rows))throw new Error('invalid_response');
        state.dataset.kind='unknown';state.textContent=rows.length===0?'Для этого объекта ещё не настроены бронируемые единицы. Все даты требуют подтверждения у хозяина.':'Публичная детализация занятости пока не подключена. Все даты требуют подтверждения у хозяина.';
      }catch(error){state.dataset.kind='error';state.textContent='Не удалось проверить источник доступности. Не считайте даты свободными — уточните их у хозяина.'}
      finally{clearTimeout(timer)}
    }
    document.getElementById('prevMonth').addEventListener('click',()=>{month.setMonth(month.getMonth()-1);render()});
    document.getElementById('nextMonth').addEventListener('click',()=>{month.setMonth(month.getMonth()+1);render()});
    render();checkInventory();
  })();
  </script>
</body>
</html>
