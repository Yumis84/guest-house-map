<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бронирование</title><link rel="stylesheet" href="v2.css"><main><h1 id="title">Бронирование</h1><p id="status" role="status">Проверяем доступность…</p><form id="form" hidden><fieldset id="fields" disabled><label>Заезд<input id="checkin" type="date" required></label><label>Выезд<input id="checkout" type="date" required></label><label>Гости<input id="guests" type="number" min="1" value="1" required></label><label>Имя<input id="name" maxlength="120" autocomplete="given-name" required></label><label>Телефон<input id="phone" type="tel" placeholder="+7" maxlength="40" autocomplete="tel" required></label><label>Комментарий<textarea id="comment" maxlength="1000"></textarea></label><label class="trap" aria-hidden="true">Сайт<input id="website" tabindex="-1" autocomplete="off"></label><label><input id="consent" type="checkbox" required> Согласен на обработку данных по <a id="policy" target="_blank" rel="noopener noreferrer">политике</a></label><div id="captcha"></div><button id="submit">Отправить заявку</button></fieldset></form><button id="launcher" hidden type="button">Открыть бронирование</button><button id="refresh" type="button">Обновить доступность</button></main><script src="../supabase-public-config.js"></script><script src="v2-runtime.js"></script><script type="module" src="v2.js"></script></html>
