name: Booking server candidate
on:
  pull_request:
    paths: ['sql/booking-m*-*.CANDIDATE.sql', 'tests/booking/**', 'package*.json', '.github/workflows/booking-server-candidate.yml']
  push:
    branches: [feat/booking-m1-reviewed, feat/booking-m2-reviewed]
permissions:
  contents: read
jobs:
  postgres-m1:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bookingtest
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: synthetic_booking_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node tests/booking/postgres.test.mjs
        env:
          BOOKING_M1_ONLY: 'true'
          BOOKING_TEST_DATABASE_URL: postgresql://bookingtest:synthetic-only@127.0.0.1:5432/synthetic_booking_ci
