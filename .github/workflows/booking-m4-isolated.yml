name: Booking M4 isolated acceptance
on:
  pull_request:
    paths: ['sql/booking-m4*', 'scripts/booking-*', 'booking-owner.js', 'tests/booking/**', '.github/workflows/booking-m4-isolated.yml']
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bookingtest
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: synthetic_booking_m4_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U bookingtest -d template1" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOOKING_TEST_DATABASE_URL: postgresql://bookingtest:synthetic-only@127.0.0.1:5432/synthetic_booking_m4_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node tests/booking/stand/m4-acceptance.mjs
      - run: node tests/booking/stand/backup-restore.mjs
        env:
          M4_PG_CONTAINER: ${{ job.services.postgres.id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4-compatibility-evidence
          path: test-results/m4/
  real-auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bookingtest
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: synthetic_booking_m4_auth_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U bookingtest -d template1" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOOKING_TEST_DATABASE_URL: postgresql://bookingtest:synthetic-only@127.0.0.1:5432/synthetic_booking_m4_auth_ci
      M4_GOTRUE_URL: http://127.0.0.1:9999
      M4_AUTH_JWT_SECRET: synthetic-ci-only-jwt-secret-00000000000000000000
      POSTGREST_BIN: /tmp/m4-postgrest/postgrest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Start actual isolated GoTrue
        run: |
          mkdir /tmp/m4-postgrest
          curl -fLsS https://github.com/PostgREST/postgrest/releases/download/v16.5/postgrest-v16.5-linux-static-x86-64.tar.xz | tar -xJ -C /tmp/m4-postgrest
          node -e "const{Client}=require('pg');(async()=>{const c=new Client({connectionString:process.env.BOOKING_TEST_DATABASE_URL});await c.connect();await c.query('create schema if not exists auth');await c.query('create role postgres nologin');await c.end();})();"
          docker run -d --name m4-gotrue --network host \
            -e GOTRUE_API_HOST=127.0.0.1 -e GOTRUE_API_PORT=9999 \
            -e API_EXTERNAL_URL=http://127.0.0.1:9999 \
            -e GOTRUE_DB_DRIVER=postgres -e GOTRUE_DB_NAMESPACE=auth \
            -e GOTRUE_DB_DATABASE_URL="$BOOKING_TEST_DATABASE_URL" \
            -e GOTRUE_SITE_URL=http://127.0.0.1:55444 \
            -e GOTRUE_JWT_SECRET="$M4_AUTH_JWT_SECRET" \
            -e GOTRUE_JWT_ADMIN_ROLES=service_role -e GOTRUE_JWT_AUD=authenticated \
            -e GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated \
            -e GOTRUE_EXTERNAL_EMAIL_ENABLED=true -e GOTRUE_MAILER_AUTOCONFIRM=true \
            supabase/gotrue:v2.197.0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9999/health > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs m4-gotrue
          exit 1
      - run: node tests/booking/stand/gotrue-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4-real-gotrue-evidence
          path: test-results/m4/
      - name: Stop only this test Auth container
        if: always()
        run: docker rm -f m4-gotrue || true
  turnstile-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/booking/stand/turnstile-provider.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4-real-turnstile-testkeys-evidence
          path: test-results/m4/
  real-edge:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bookingtest
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: synthetic_booking_m4_edge_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U bookingtest -d template1" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOOKING_TEST_DATABASE_URL: postgresql://bookingtest:synthetic-only@127.0.0.1:5432/synthetic_booking_m4_edge_ci
      POSTGREST_BIN: /tmp/m4-postgrest/postgrest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: |
          mkdir /tmp/m4-postgrest
          curl -fLsS https://github.com/PostgREST/postgrest/releases/download/v16.5/postgrest-v16.5-linux-static-x86-64.tar.xz | tar -xJ -C /tmp/m4-postgrest
          docker pull supabase/edge-runtime:v1.77.4
      - run: node --test tests/booking/gateway.test.mjs
      - run: node tests/booking/stand/edge-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4-real-edge-evidence
          path: test-results/m4/
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bookingtest
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: synthetic_booking_m4_browser_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U bookingtest -d template1" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOOKING_TEST_DATABASE_URL: postgresql://bookingtest:synthetic-only@127.0.0.1:5432/synthetic_booking_m4_browser_ci
      POSTGREST_BIN: /tmp/m4-postgrest/postgrest
      M3_TLS_KEY: /tmp/m4-local.key
      M3_TLS_CERT: /tmp/m4-local.crt
      M3_PORT: '55446'
      M3_REST_PORT: '55447'
      M3_BASE: https://127.0.0.1:55446
      M4_STAND: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          mkdir /tmp/m4-postgrest
          curl -fLsS https://github.com/PostgREST/postgrest/releases/download/v16.5/postgrest-v16.5-linux-static-x86-64.tar.xz | tar -xJ -C /tmp/m4-postgrest
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/m4-local.key -out /tmp/m4-local.crt -days 1 -subj /CN=127.0.0.1 -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost'
      - run: |
          node tests/booking/stand/server.mjs > /tmp/m4-stand.log 2>&1 &
          stand_pid=$!
          trap 'kill "$stand_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fksS https://127.0.0.1:55446/synthetic-meta > /dev/null; then break; fi
            if ! kill -0 "$stand_pid" 2>/dev/null; then cat /tmp/m4-stand.log; exit 1; fi
            sleep 1
          done
          node tests/booking/stand/m4-browser.mjs
          node tests/booking/stand/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4-browser-evidence
          path: test-results/
